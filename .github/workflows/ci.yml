# Lint, unit tests, integration test in VS Code, then the .vsix as an artifact. The integration
# test also runs on the oldest VS Code allowed by engines.vscode, in a job of its own. On a pull
# request to main that changes the version, a third job runs the checks of the release that its
# merge starts.
# Also called by release.yml, which publishes the .vsix built here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      vsix:
        description: File name of the .vsix, which is also the name of its artifact
        value: ${{ jobs.build.outputs.vsix }}

permissions:
  contents: read

concurrency:
  # "ci-" prefix: release.yml calls this workflow on the same ref, a shared group would deadlock.
  # github.workflow is the caller's name ("Release") when release.yml calls it: the build of a
  # release neither waits behind nor gets replaced by the CI run of the same push to main.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Also runs postinstall, which copies the pinned Mermaid build into views/vendor/
      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit

      - name: Integration test in VS Code
        # --ignore-scripts skips the pretest hook: lint and unit tests already ran above
        run: xvfb-run -a npm test --ignore-scripts

      - name: Package
        id: package
        run: |
          npm run package
          vsix=$(node -p "const p = require('./package.json'); p.name + '-' + p.version + '.vsix'")
          test -f "builds/$vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      # builds/ also holds the .vsix of older releases (committed): upload only the new one.
      # Not zipped (archive: false), so the artifact is the .vsix itself, named after it.
      # overwrite: a re-run of this job replaces the artifact instead of failing on its name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: builds/${{ steps.package.outputs.vsix }}
          archive: false
          overwrite: true
          if-no-files-found: error

  # The webview runs in the Chromium of the user's VS Code: check that the bundled Mermaid still
  # draws there on the oldest version allowed by engines.vscode (a Mermaid update may need a newer
  # Chromium, then engines.vscode is raised or the incompatibility fixed)
  oldest-vscode:
    name: Integration test on the oldest supported VS Code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # "^1.96.0" -> 1.96.0, read by .vscode-test.mjs
      - name: Oldest version of engines.vscode
        run: |
          version=$(node -p "require('./package.json').engines.vscode.match(/\d+\.\d+\.\d+/)[0]")
          echo "VSCODE_TEST_VERSION=$version" >> "$GITHUB_ENV"
          echo "::notice::Integration test on VS Code $version"

      - name: Integration test in VS Code ${{ env.VSCODE_TEST_VERSION }}
        run: xvfb-run -a npm test --ignore-scripts

  # Merging a pull request that changes the version releases it (release.yml): its CHANGELOG
  # section is checked here, so that a missing, empty or "Unreleased" section shows on the pull
  # request instead of failing the release on main
  release-notes:
    name: Version and changelog of the release
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The merge commit of the pull request and its parents: the first parent is main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Version and changelog
        run: |
          version=$(node -p "require('./package.json').version")
          base=$(git show HEAD^1:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$version" = "$base" ]; then
            echo "::notice::The version stays $version: merging this pull request releases nothing"
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=package.json::Version \"$version\" is not MAJOR.MINOR.PATCH, as the registries need"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$base" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::error file=package.json::Version $version is lower than $base on main: raise it"
            exit 1
          fi
          bash .github/scripts/release-notes.sh "v$version" /dev/null
          echo "::notice::Merging this pull request releases v$version (main is at $base)"
