<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawMeDatabase</title>
    <link rel="stylesheet" href="{{THEME_CSS}}">
</head>

<body>
    <div id="progress" class="progress" hidden></div>

    <header class="toolbar">
        <div class="tabs" role="tablist" aria-label="Viewer">
            <button type="button" role="tab" id="tab-diagram" data-viewer="diagram" aria-controls="diagram-view" aria-selected="true" data-i18n="tab.diagram">Diagram</button>
            <button type="button" role="tab" id="tab-json" data-viewer="json" aria-controls="json-view" aria-selected="false" tabindex="-1" data-i18n="tab.json">JSON</button>
        </div>

        <div id="summary" class="summary"></div>

        <div id="focus" class="focus" hidden>
            <span id="focus-label" class="focus-label"></span>
            <button type="button" class="icon" id="focus-clear" title="Show the whole schema" aria-label="Show the whole schema" data-i18n-title="focus.clear" data-i18n-label="focus.clear">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
        </div>

        <div class="search">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
            <input type="search" id="search" placeholder="Filter tables" aria-label="Filter tables by table or column name (Ctrl+F)" title="Tables whose name or columns contain the text, with their neighbours (Ctrl+F)" data-i18n-placeholder="search.placeholder" data-i18n-label="search.label" data-i18n-title="search.title" spellcheck="false" autocomplete="off">
            <span id="search-count" class="search-count" aria-live="polite"></span>
        </div>

        <div class="actions">
            <div class="group" data-viewer-only="diagram">
                <select id="layout-select" class="select" title="Layout engine" aria-label="Layout engine" data-i18n-title="layout.label" data-i18n-label="layout.label">
                    <option value="dagre">Dagre</option>
                    <option value="elk">ELK</option>
                </select>
                <button type="button" class="icon" id="direction-button" title="Direction: top to bottom" aria-label="Direction: top to bottom">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M4 10l4 4 4-4"/></svg>
                </button>
                <button type="button" class="icon" id="git-button" aria-pressed="true" title="Git status: new, modified and unsaved tables and columns" aria-label="Show the git status" data-i18n-title="git.title">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="6.5" r="1.5"/><path d="M4.5 5v6M11.5 8c0 2-2 2.5-4 3l-1.6.6"/></svg>
                </button>
                <span class="separator" aria-hidden="true"></span>
                <button type="button" class="icon" id="zoom-out" title="Zoom out (-)" aria-label="Zoom out" data-i18n-title="zoom.out" data-i18n-label="zoom.out">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
                </button>
                <button type="button" class="text-button zoom-level" id="zoom-level" title="Actual size (0)" aria-label="Actual size" data-i18n-title="zoom.actual" data-i18n-label="zoom.actual">100%</button>
                <button type="button" class="icon" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in" data-i18n-title="zoom.in" data-i18n-label="zoom.in">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg>
                </button>
                <button type="button" class="icon" id="zoom-fit" title="Fit to window (F)" aria-label="Fit to window" data-i18n-title="zoom.fit" data-i18n-label="zoom.fit">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
                </button>
                <span class="separator" aria-hidden="true"></span>
            </div>

            <div class="menu-anchor">
                <button type="button" class="text-button" id="export-button" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu" title="Export" data-i18n-title="export.button">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>
                    <span data-i18n="export.button">Export</span>
                </button>
                <div id="export-menu" class="menu" role="menu" aria-labelledby="export-button" hidden></div>
            </div>
            <button type="button" class="icon" id="refresh-button" title="Refresh from the code" aria-label="Refresh from the code" data-i18n-title="refresh" data-i18n-label="refresh">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1M13.5 2v3.5H10"/></svg>
            </button>
            <button type="button" class="icon" id="panel-button" aria-expanded="false" aria-controls="side-panel" title="Options, appearance and tools" aria-label="Options, appearance and tools" data-i18n-title="panel.toggle" data-i18n-label="panel.toggle">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v10H2zM10 3v10M11.5 5.5h1M11.5 7.5h1"/></svg>
            </button>
        </div>
    </header>

    <div class="workspace">
    <main>
        <section id="diagram-view" class="view" role="tabpanel" aria-labelledby="tab-diagram">
            <div id="viewport" class="viewport" tabindex="0" aria-label="Database diagram. Drag to move it, Ctrl and the mouse wheel to zoom, F to fit." data-i18n-label="viewport.label">
                <div id="stage" class="stage"></div>
            </div>
            <div id="legend" class="legend" aria-label="Git status of the tables" data-i18n-label="legend.label" hidden></div>
            <div id="message" class="message" role="alert" hidden></div>
            <p class="credit">DrawMeDatabase - by Guillaume Cancalon ©</p>
        </section>

        <section id="json-view" class="view" role="tabpanel" aria-labelledby="tab-json" hidden>
            <pre id="json-output" class="json" tabindex="0"></pre>
        </section>
    </main>

    <aside id="side-panel" class="side-panel" aria-label="Options" hidden></aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

{{SCRIPTS}}
</body>
</html>
