<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawMeDatabase - JSON Viewer</title>
    <link rel="stylesheet" href="{{THEME_CSS}}">
</head>

<body>
    <!-- Header -->
    <div class="header">
        <h1 id="viewerTitle">JSON Viewer</h1>
        <div class="credit">
            <p>DrawMeDatabase - by Guillaume Cancalon ©</p>
        </div>
        <select id="viewer-select" aria-label="Viewer">
            <option value="json" selected>JSON</option>
            <option value="mermaid">Mermaid</option>
        </select>
    </div>

    <!-- JSON Viewer -->
    <div id="json-viewer" class="json-viewer">
        <button id="copy-btn" type="button">Copy code</button>
        <pre id="json-output"></pre>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Schema data (JSON, not executed) -->
    <script id="dmdb-data" type="application/json">{{DATA}}</script>

    <script nonce="{{NONCE}}" src="{{COMMON_JS}}"></script>
    <script nonce="{{NONCE}}" src="{{VIEWER_JS}}"></script>
</body>
</html>
