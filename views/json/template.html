<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Viewer</title>
  <style>
    /* CSS_STYLES */
  </style>
</head>

<body>
  <!-- Header -->
  <div class="header">
    <h1 id="viewerTitle">JSON Viewer</h1>
    <div class="credit">
      <p>DrawMeDatabase - by Guillaume Cancalon ©</p>
    </div>
    <select id="viewerSelect" onchange="changeViewer(this.value)">
      <option value="json" selected>JSON</option>
      <option value="mermaid">Mermaid</option>
    </select>
  </div>

  <!-- JSON Viewer -->
  <div id="jsonViewer" style="position: relative;">
    <button id="copy-btn" style="position: absolute; top: 0; right: 0;">
      <i class="fa-regular fa-clipboard"></i> Copy code</button>
    <pre id="jsonData"></pre>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">JSON code successfully copied!</div>

  <!-- JSON Data Injection -->
  JSON_DATA

  <script>
    /* SCRIPT_METHOD */
  </script>

  <script>
    function changeViewer(viewer) {
      const vscode = acquireVsCodeApi();
      vscode.postMessage({
        command: 'changeViewer',
        viewer: viewer
      });
    }
  </script>

</body>
</html>
