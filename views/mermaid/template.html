<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawMeDatabase - Mermaid Viewer</title>
    <link rel="stylesheet" href="{{THEME_CSS}}">
</head>

<body class="mermaid-page">
    <div class="header">
        <h1 id="viewerTitle">Mermaid Viewer</h1>
        <select id="viewer-select" aria-label="Viewer">
            <option value="json">JSON</option>
            <option value="mermaid" selected>Mermaid</option>
        </select>
    </div>

    <div class="mermaid-container">
        <div class="credit">
            <p>DrawMeDatabase - by Guillaume Cancalon ©</p>
        </div>
        <div id="mermaid-diagram" class="mermaid-diagram"></div>
    </div>

    <!-- Schema data (JSON, not executed) -->
    <script id="dmdb-data" type="application/json">{{DATA}}</script>

    <script nonce="{{NONCE}}" src="{{MERMAID_JS}}"></script>
    <script nonce="{{NONCE}}" src="{{GENERATOR_JS}}"></script>
    <script nonce="{{NONCE}}" src="{{COMMON_JS}}"></script>
    <script nonce="{{NONCE}}" src="{{VIEWER_JS}}"></script>
</body>
</html>
