<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramme ER avec Mermaid</title>
    <style>
      /* CSS_STYLES */
      .mermaid {
        width: max-content;
        display: inline;
        vertical-align:top
      }
      .mermaid {
        width: max-content;
        display: inline;
        vertical-align: top;
      }

      .mermaid svg text {
        font-size: 12px !important;
      }
    </style>

    <!-- Mermaid library -->
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({
        securityLevel: 'loose',
        theme: 'dark',
        startOnLoad: true,
      });
    </script>
</head>

<body>
  <div class="header">
    <h1 id="viewerTitle">Mermaid Viewer</h1>
    <select id="viewerSelect" onchange="changeViewer(this.value)">
      <option value="json">JSON</option>
      <option value="mermaid" selected>Mermaid</option>
    </select>
  </div>
  

  <div class="mermaid-container" style="border: 1px solid black; background-color: #3d3d3d; border-radius: 7px; margin-right: 10px;">
    <div class="credit">
      <p>DrawMeDatabase - by Guillaume Cancalon ©</p>
    </div>
    <div id="mermaid-diagram"></div>
  </div>

  JSON_DATA

  <script>
    /* SCRIPT_METHOD */
  </script>
  
  <script>
    function changeViewer(viewer) {
      const vscode = acquireVsCodeApi();
      vscode.postMessage({
        command: 'changeViewer',
        viewer: viewer
      });
    }
  </script>
  
</body>
</html>
